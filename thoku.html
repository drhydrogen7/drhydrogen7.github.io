// Initialize Shaka Player with the attach method
async function initShakaPlayer() {
    try {
        // Check if Shaka Player is available
        if (typeof shaka === 'undefined') {
            console.error('Shaka Player not loaded');
            return;
        }

        // Get video element
        const video = document.getElementById('video');
        
        // Initialize player
        const player = new shaka.Player(video);
        
        // Use attach method instead of mediaElement
        await player.attach(video);
        
        // Load your manifest
        // await player.load('your-manifest-url.mpd');
        
        console.log('Shaka Player initialized successfully');
        
    } catch (error) {
        console.error('Shaka Player initialization failed:', error);
    }
}

// Initialize when page loads
document.addEventListener('DOMContentLoaded', initShakaPlayer);
